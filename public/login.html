<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
  <h1>Login</h1>
  <input id="u" placeholder="Username"><br>
  <input id="p" type="password" placeholder="Password"><br>
  <button onclick="go()">Login</button>
  <p id="msg"></p>
  <a href="index.html">Home</a>
  <p>Note: This is a demo login page. The username and password are not validated against any database.</p>
  <script>
    async function go() {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u.value, password: p.value })
      });
      msg.textContent = (await res.json()).message;
    }
  </script>
</body>
</html>
